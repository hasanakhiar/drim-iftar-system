name: Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    strategy:
      matrix:
        node-version: ['16.x', '18.x', '20.x']
      fail-fast: false
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      # Identity Provider Tests
      - name: Install Identity Provider Dependencies
        run: cd identity-provider && npm ci --prefer-offline --no-audit
      
      - name: Run Identity Provider Unit Tests
        run: cd identity-provider && npm test -- tests/auth.test.js --coverage
        continue-on-error: true
      
      # Order Gateway Tests
      - name: Install Order Gateway Dependencies
        run: cd order-gateway && npm ci --prefer-offline --no-audit
      
      - name: Run Order Gateway Validation Tests
        run: cd order-gateway && npm test -- tests/validation.test.js --coverage
        continue-on-error: true
      
      - name: Run Order Gateway Integration Tests
        run: cd order-gateway && npm test -- tests/integration.test.js --coverage
        continue-on-error: true
      
      # Stock Service Tests
      - name: Install Stock Service Dependencies
        run: cd stock-service && npm ci --prefer-offline --no-audit
      
      - name: Run Stock Service Utility Tests
        run: cd stock-service && npm test -- tests/stockUtils.test.js --coverage
        continue-on-error: true
      
      - name: Run Stock Service Integration Tests
        run: cd stock-service && npm test -- tests/integration.test.js --coverage
        continue-on-error: true
      
      # Kitchen Queue Tests
      - name: Install Kitchen Queue Dependencies
        run: cd kitchen-queue && npm ci --prefer-offline --no-audit
      
      - name: Run Kitchen Queue Tests
        run: cd kitchen-queue && npm test
        continue-on-error: true
      
      # Notification Hub Tests
      - name: Install Notification Hub Dependencies
        run: cd notification-hub && npm ci --prefer-offline --no-audit
      
      - name: Run Notification Hub Tests
        run: cd notification-hub && npm test
        continue-on-error: true
      
      # Coverage Upload
      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-node-${{ matrix.node-version }}
          path: '**/coverage'
          if-no-files-found: 'warn'
          retention-days: 30
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: '**/test-results'
          if-no-files-found: 'warn'
          retention-days: 30
      
      - name: Codecov Upload
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-node-${{ matrix.node-version }}
          fail_ci_if_error: false
          verbose: true
