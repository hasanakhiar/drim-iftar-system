name: CI Pipeline - Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      # Identity Provider Tests
      - name: Install Identity Provider Dependencies
        run: cd identity-provider && npm ci
      
      - name: Run Identity Provider Unit Tests
        run: cd identity-provider && npm test -- tests/auth.test.js --coverage
      
      # Order Gateway Tests
      - name: Install Order Gateway Dependencies
        run: cd order-gateway && npm ci
      
      - name: Run Order Gateway Unit Tests
        run: cd order-gateway && npm test -- tests/validation.test.js --coverage
      
      - name: Run Order Gateway Integration Tests
        run: cd order-gateway && npm test -- tests/integration.test.js --coverage
      
      # Stock Service Tests
      - name: Install Stock Service Dependencies
        run: cd stock-service && npm ci
      
      - name: Run Stock Service Unit Tests
        run: cd stock-service && npm test -- tests/stockUtils.test.js --coverage
      
      - name: Run Stock Service Integration Tests
        run: cd stock-service && npm test -- tests/integration.test.js --coverage
      
      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/coverage'
          if-no-files-found: 'warn'
