name: CI Pipeline - Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            identity-provider/package-lock.json
            order-gateway/package-lock.json
            stock-service/package-lock.json
      
      # Identity Provider Tests
      - name: Identity Provider Tests
        run: |
          cd identity-provider
          npm install
          npm test -- tests/auth.test.js
      
      # Order Gateway Tests
      - name: Order Gateway Tests
        run: |
          cd order-gateway
          npm install
          npm test -- tests/validation.test.js
          npm test -- tests/integration.test.js
      
      # Stock Service Tests
      - name: Stock Service Tests
        run: |
          cd stock-service
          npm install
          npm test -- tests/stockUtils.test.js
          npm test -- tests/integration.test.js
      
      - name: Upload Coverage Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ matrix.node-version }}
          path: |
            **/coverage
