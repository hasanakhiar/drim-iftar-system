name: CI Pipeline - E2E Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly

jobs:
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Start Services
        run: |
          docker-compose up -d
          sleep 15
          docker-compose ps
      
      - name: Health Check
        run: |
          for port in 3001 3002 3003 3004 3005; do
            echo "Checking port $port..."
            curl --retry 5 --retry-delay 2 -f http://localhost:$port/health || (docker-compose logs && exit 1)
          done
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Run E2E Script
        run: |
          npm install
          npm test -- e2e.test.js
      
      - name: Cleanup
        if: always()
        run: docker-compose down -v
