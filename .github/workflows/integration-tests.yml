name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration Tests with Services
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      mongodb:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      rabbitmq:
        image: rabbitmq:3-management
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Verify Service Health - MongoDB
        run: |
          timeout 30 bash -c 'until mongosh mongodb://admin:password@localhost:27017 --eval "db.adminCommand(\"ping\")" > /dev/null 2>&1; do echo "Waiting for MongoDB..."; sleep 2; done'
          echo "✓ MongoDB is healthy"
      
      - name: Verify Service Health - Redis
        run: |
          timeout 30 bash -c 'until redis-cli -h localhost ping; do echo "Waiting for Redis..."; sleep 2; done'
          echo "✓ Redis is healthy"
      
      - name: Verify Service Health - RabbitMQ
        run: |
          timeout 30 bash -c 'until curl -s -u guest:guest http://localhost:15672/api/aliveness-test/%2F > /dev/null 2>&1; do echo "Waiting for RabbitMQ..."; sleep 2; done'
          echo "✓ RabbitMQ is healthy"
      
      - name: Install Dependencies for All Services
        run: |
          for service in identity-provider order-gateway stock-service kitchen-queue notification-hub; do
            echo "Installing dependencies for $service..."
            (cd "$service" && npm ci --prefer-offline --no-audit) || exit 1
          done
      
      - name: Create MongoDB Collections
        run: |
          mongosh mongodb://admin:password@localhost:27017 << 'EOF'
          use cafeteria;
          db.createCollection("orders");
          db.createCollection("students");
          db.createCollection("inventory");
          db.createCollection("menus");
          EOF
      
      - name: Run Integration Tests
        env:
          MONGODB_URI: mongodb://admin:password@localhost:27017/cafeteria
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
        run: |
          echo "Running Order Gateway Integration Tests..."
          (cd order-gateway && npm test -- tests/integration.test.js --coverage) || true
          
          echo "Running Stock Service Integration Tests..."
          (cd stock-service && npm test -- tests/integration.test.js --coverage) || true
      
      - name: Docker Compose Build Verification
        run: |
          echo "Verifying Docker Compose configuration..."
          docker-compose config > /dev/null 2>&1
          echo "✓ Docker Compose configuration is valid"
      
      - name: Upload Integration Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: '**/coverage'
          if-no-files-found: 'warn'
          retention-days: 30
      
      - name: Collect Service Logs on Failure
        if: failure()
        run: |
          mkdir -p logs
          echo "=== MongoDB Logs ===" > logs/mongodb.log
          docker logs $(docker ps -q -f ancestor=mongo:7) >> logs/mongodb.log 2>&1 || true
          
          echo "=== Redis Logs ===" > logs/redis.log
          docker logs $(docker ps -q -f ancestor=redis:7-alpine) >> logs/redis.log 2>&1 || true
          
          echo "=== RabbitMQ Logs ===" > logs/rabbitmq.log
          docker logs $(docker ps -q -f ancestor=rabbitmq:3-management) >> logs/rabbitmq.log 2>&1 || true
      
      - name: Upload Service Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: logs/
          retention-days: 7
        run: |
          cd notification-hub
          nohup npm start > /tmp/notification-hub.log 2>&1 &
          sleep 3
      
      - name: Health Check - All Services
        run: |
          for service in identity-provider order-gateway stock-service kitchen-queue notification-hub; do
            port=$(grep "PORT=" $service/.env 2>/dev/null | cut -d'=' -f2)
            if [ -z "$port" ]; then
              case $service in
                identity-provider) port=3001;;
                order-gateway) port=3002;;
                stock-service) port=3003;;
                kitchen-queue) port=3004;;
                notification-hub) port=3005;;
              esac
            fi
            echo "Checking $service on port $port..."
            npx wait-on http://localhost:$port/health --timeout 30000 || exit 1
          done
      
      - name: Run Service-to-Service Tests
        run: |
          npm test -- e2e.test.js --testNamePattern="Order Flow" --testTimeout=15000
      
      - name: Run Concurrency Tests
        run: |
          npm test -- e2e.test.js --testNamePattern="Concurrent" --testTimeout=15000
      
      - name: Run Resilience Tests
        run: |
          npm test -- e2e.test.js --testNamePattern="Chaos Mode" --testTimeout=15000
      
      - name: Collect Service Logs
        if: failure()
        run: |
          mkdir -p /tmp/logs
          cp /tmp/identity-provider.log /tmp/logs/ || true
          cp /tmp/order-gateway.log /tmp/logs/ || true
          cp /tmp/stock-service.log /tmp/logs/ || true
          cp /tmp/kitchen-queue.log /tmp/logs/ || true
          cp /tmp/notification-hub.log /tmp/logs/ || true
      
      - name: Upload Service Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: /tmp/logs

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Images
        run: docker-compose build --progress=plain
      
      - name: Verify Docker Compose Configuration
        run: docker-compose config
      
      - name: Test Docker Compose Up
        run: |
          docker-compose up -d
          sleep 15
          docker-compose ps
          docker-compose logs
          docker-compose down -v
