name: CI Pipeline - Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install All Dependencies
        run: |
          for dir in identity-provider order-gateway stock-service kitchen-queue notification-hub; do
            cd $dir && npm ci && cd ..
          done

      - name: Start Services
        env:
          JWT_SECRET: test-secret-key
          MONGO_URI: mongodb://localhost:27017/cafeteria
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://localhost:5672
        run: |
          # Use localhost for services because they are running in the runner's network stack
          # We need to set these env vars for the background processes
          export PORT=3001 && cd identity-provider && nohup npm start > /tmp/identity-provider.log 2>&1 &
          export PORT=3002 && cd ../order-gateway && nohup npm start > /tmp/order-gateway.log 2>&1 &
          export PORT=3003 && cd ../stock-service && nohup npm start > /tmp/stock-service.log 2>&1 &
          export PORT=3004 && cd ../kitchen-queue && nohup npm start > /tmp/kitchen-queue.log 2>&1 &
          export PORT=3005 && cd ../notification-hub && nohup npm start > /tmp/notification-hub.log 2>&1 &
          sleep 10
      
      - name: Health Check
        run: |
          for port in 3001 3002 3003 3004 3005; do
            echo "Checking port $port..."
            curl --retry 5 --retry-delay 2 -f http://localhost:$port/health || (cat /tmp/*.log && exit 1)
          done
      
      - name: Run E2E Tests
        run: npm test -- e2e.test.js
      
      - name: Collect Logs on Failure
        if: failure()
        run: |
          mkdir -p logs
          cp /tmp/*.log logs/
        
      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: logs/
