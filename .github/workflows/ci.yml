name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quick validation and linting
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Validate Docker Compose
        run: docker-compose config > /dev/null 2>&1
      
      - name: Validate Package JSON Files
        run: |
          for dir in identity-provider order-gateway stock-service kitchen-queue notification-hub admin-dashboard student-ui; do
            if [ -f "$dir/package.json" ]; then
              echo "Validating $dir/package.json..."
              npm ls --prefix "$dir" > /dev/null 2>&1 || echo "Warning: Dependencies may need review in $dir"
            fi
          done
  
  # Unit tests with matrix
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    
    strategy:
      matrix:
        node-version: ['16.x', '18.x', '20.x']
      fail-fast: false
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Install & Run Unit Tests
        run: |
          for service in identity-provider order-gateway stock-service kitchen-queue notification-hub; do
            if [ -f "$service/package.json" ]; then
              echo "Testing $service..."
              (cd "$service" && npm ci --prefer-offline --no-audit && npm test -- --coverage 2>/dev/null) || true
            fi
          done
      
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.node-version }}
          path: '**/coverage'
          if-no-files-found: 'warn'
          retention-days: 30
  
  # Integration tests with services
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    
    services:
      mongodb:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      rabbitmq:
        image: rabbitmq:3-management
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Wait for Services
        run: |
          echo "Waiting for MongoDB..."
          timeout 30 bash -c 'until mongosh mongodb://admin:password@localhost:27017 --eval "db.adminCommand(\"ping\")" > /dev/null 2>&1; do sleep 2; done'
          
          echo "Waiting for Redis..."
          timeout 30 bash -c 'until redis-cli -h localhost ping; do sleep 2; done'
          
          echo "Waiting for RabbitMQ..."
          timeout 30 bash -c 'until curl -s -u guest:guest http://localhost:15672/api/aliveness-test/%2F > /dev/null 2>&1; do sleep 2; done'
      
      - name: Install Dependencies
        run: |
          for service in identity-provider order-gateway stock-service kitchen-queue notification-hub; do
            (cd "$service" && npm ci --prefer-offline --no-audit) || true
          done
      
      - name: Run Integration Tests
        env:
          MONGODB_URI: mongodb://admin:password@localhost:27017/cafeteria
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
        run: |
          (cd order-gateway && npm test -- tests/integration.test.js --coverage 2>/dev/null) || true
          (cd stock-service && npm test -- tests/integration.test.js --coverage 2>/dev/null) || true
      
      - name: Collect Service Logs
        if: failure()
        run: |
          mkdir -p logs
          docker logs $(docker ps -q -f ancestor=mongo:7) > logs/mongodb.log 2>&1 || true
          docker logs $(docker ps -q -f ancestor=redis:7-alpine) > logs/redis.log 2>&1 || true
          docker logs $(docker ps -q -f ancestor=rabbitmq:3-management) > logs/rabbitmq.log 2>&1 || true
      
      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: logs/
          retention-days: 7
  
  # Status check
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [validate, unit-tests, integration-tests]
    if: always()
    
    steps:
      - name: Check Test Results
        run: |
          if [ "${{ needs.validate.result }}" == "failure" ] || [ "${{ needs.unit-tests.result }}" == "failure" ] || [ "${{ needs.integration-tests.result }}" == "failure" ]; then
            echo "❌ CI pipeline failed"
            exit 1
          fi
          echo "✅ CI pipeline passed"
